  <rect x="680" y="480" width="240" height="160" rx="16" fill="#fff" stroke="#1e293b" stroke-width="6"/>
  <rect x="700" y="510" width="80" height="50" rx="8" fill="#7dd3fc" stroke="#0369a1" stroke-width="4"/>
  <rect x="820" y="510" width="80" height="50" rx="8" fill="#7dd3fc" stroke="#0369a1" stroke-width="4"/>
  <rect x="760" y="580" width="80" height="60" rx="8" fill="#fbbf24" stroke="#1e293b" stroke-width="5"/>
